[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-rag-community-detector"
version = "0.1.0"
description = "In-memory Louvain modularity knowledge graph community detection algorithm that builds hierarchical semantic clusters for global RAG queries"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
graph-rag-community-detector = "graph_rag_community_detector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["graph_rag_community_detector*"]
